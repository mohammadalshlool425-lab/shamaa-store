name: SHAM'A tests

on:
  pull_request:
  push:
    branches: [main, 'arena/**', 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server, permissions, stock and encrypted restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install verified dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci
          python -m pip check
      - name: Syntax, isolated backend tests and coverage gate
        run: bash tests/run.sh
      - name: Audit runtime and browser dependencies
        run: |
          python -m pip install -r requirements-tools.txt
          python -m pip_audit --require-hashes -r requirements-dev.lock --progress-spinner off
          npm audit --audit-level=moderate

  postgres-schema:
    name: PostgreSQL 17 schema and security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shamaa_ci
          POSTGRES_USER: shamaa_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shamaa_ci -d shamaa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: ci-only-password
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: shamaa_ci
      PGDATABASE: shamaa_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install verified Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Apply isolated PostgreSQL foundation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_shamaa_app_foundation.sql
      - name: Apply phase 2 product condition migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_product_condition.sql
      - name: Apply phase 2 product image gallery migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_product_images.sql
      - name: Apply phase 2 product variant migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_product_variants.sql
      - name: Apply phase 2 private messaging migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_conversations_messages.sql
      - name: Apply phase 2 verified reviews migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0006_verified_reviews.sql
      - name: Apply phase 2 shipment case migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0007_shipment_cases.sql
      - name: Verify schema, RLS, append-only guards and core constraints
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/schema_contract.sql
      - name: Run Psycopg 3 adapter integration contract
        env:
          SHAMAA_TEST_DATABASE_URL: postgresql://shamaa_ci:ci-only-password@localhost:5432/shamaa_ci
        run: python -m pytest -q tests/test_postgres_adapter.py
      - name: Run FastAPI application smoke tests on PostgreSQL
        env:
          SHAMAA_TEST_DATABASE_URL: postgresql://shamaa_ci:ci-only-password@localhost:5432/shamaa_ci
        run: python -m pytest -q tests/test_postgres_application.py

  browser:
    name: Bilingual mobile checkout, seller/admin, axe and offline
    runs-on: ubuntu-latest
    needs: [server, postgres-schema]
    timeout-minutes: 15
    env:
      PYTHON: python
      SHAMAA_BUNDLED_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - name: Six isolated Chromium scenarios
        run: npm run test:browser -- --reporter=line
      # No DB, .env, generated passwords, traces, mail or private screenshots
      # are uploaded. CI execution itself must be checked in GitHub after push.
