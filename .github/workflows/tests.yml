name: SHAM'A tests

on:
  pull_request:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server, permissions, stock and encrypted restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install verified dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci
          python -m pip check
      - name: Syntax, isolated backend tests and coverage gate
        run: bash tests/run.sh
      - name: Audit runtime and browser dependencies
        run: |
          python -m pip install -r requirements-tools.txt
          python -m pip_audit --require-hashes -r requirements-dev.lock --progress-spinner off
          npm audit --audit-level=moderate

  browser:
    name: Bilingual mobile checkout, seller/admin, axe and offline
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 15
    env:
      PYTHON: python
      SHAMAA_BUNDLED_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci
      - name: Six isolated Chromium scenarios
        run: npm run test:browser -- --reporter=line
      # No DB, .env, generated passwords, traces, mail or private screenshots
      # are uploaded. CI execution itself must be checked in GitHub after push.
